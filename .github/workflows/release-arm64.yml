name: Build arm64 grading-environment release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check out openeclass at Release_4.3.3
        uses: actions/checkout@v4
        with:
          repository: gunet/openeclass
          ref: Release_4.3.3
          path: openeclass

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build release tarball
        working-directory: grader-env
        run: make ARCH=arm64 release

      - name: Smoke-test the tarball in a fresh prefix
        run: |
          mkdir -p /tmp/smoke
          tar -xzf grader-env/release/bsc-apm-grader-env-arm64.tar.gz -C /tmp/smoke
          cd /tmp/smoke
          ./install
          ./scripts/up
          ./scripts/status
          ./scripts/down

      - name: Publish arm64 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=grader-env-arm64
          TITLE="Grading environment (arm64)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" \
            --title "$TITLE" \
            --target "$GITHUB_SHA" \
            --latest=false \
            grader-env/release/bsc-apm-grader-env-arm64.tar.gz

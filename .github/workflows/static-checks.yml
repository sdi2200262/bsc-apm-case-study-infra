name: Static checks (ruff + pyright)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-type:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # One entry per package brought under the standard. Each package
        # carries its own ruff.toml + pyrightconfig.json and names the
        # third-party packages pyright must resolve its imports against;
        # add a package here once it has both config files.
        include:
          - package: grader
            pyright_deps: requests urllib3 pyyaml python-dateutil jsonschema
          - package: parser
            pyright_deps: pyyaml python-dotenv
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: ruff check
        run: uvx ruff@0.15.13 check .

      - name: ruff format --check
        run: uvx ruff@0.15.13 format --check .

      - name: pyright
        run: |
          uv venv
          uv pip install ${{ matrix.pyright_deps }}
          uvx pyright@1.1.409 --pythonpath .venv/bin/python

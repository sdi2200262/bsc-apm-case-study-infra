        body: Welcome to the course. Topics include vector spaces and linear maps.

  - code: BIO110
    title: Introduction to Biology
    visible: 2
    public_code: BIO110
    lang: el
    enrolled_users:
      - student_general
    announcements:
      - days_ago: 3

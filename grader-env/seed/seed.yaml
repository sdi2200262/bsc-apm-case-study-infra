        body: The recommended reading list for the upcoming semester is now available on the portal.

  - code: MATH201
    title: Linear Algebra
    visible: 2
    public_code: MATH201
    lang: el
    enrolled_users:
      - student_courses
    announcements:
      - days_ago: 45

# Grading-environment seed: the source of truth for the grader's data
# state. seed.json (consumed by seed.php inside the eclass container) and
# mock-cas/cas-config.json (baked into the mock CAS image) are generated
# from this file by generate_seed_json.py and generate_cas_config.py.
#
# This seed is deliberately distinct from the participant testing
# environment's single-user seed. The grading environment runs the same
# pinned openeclass release image as the participant package; only the
# seed data and the mock CAS user set diverge, and the CAS diverges only
# as far as needed to let the seed carry two users with disjoint
# enrolment. That disjoint enrolment is load-bearing: the one
# relative-date announcement lives only in a course the general-suite
# user is not enrolled in, so it can never reach a general response.
#
# Two users:
#   student_courses  enrolled in CS101, PHYS150, MATH201
#                     (drives get_course_announcements + the baseline tools)
#   student_general  enrolled in BIO110
#                     (drives get_general_announcements; the union with the
#                      system-wide announcements is what that suite asserts)
#
# Announcement dates are anchored at seed-apply time: seed.php inserts
# each row with `date = DATE_SUB(NOW(), INTERVAL <days_ago> DAY)`, so a
# volume-dropping reset re-anchors every date to that run's instant.

users:
  - username: student_courses
    cas_password: coursepass123
    display_name: Demo Student
    email: student_courses@example.edu
    givenname: Demo
    surname: Student
    studentid: STU1001
    status: 5
    lang: el
  - username: student_general
    cas_password: generalpass123
    display_name: Demo Student
    email: student_general@example.edu
    givenname: Demo
    surname: Student
    studentid: STU1002
    status: 5
    lang: el

cas:
  host: 172.17.0.1
  port: 18443
  context: ""
  title: Είσοδος με λογαριασμό ΕΚΠΑ

courses:
  - code: CS101
    title: Introduction to Computer Science
    visible: 2
    public_code: CS101
    lang: el
    enrolled_users:
      - student_courses
    announcements:
      - days_ago: 0
        title: Algorithm review session today
        body: An algorithm review session is scheduled for this afternoon at 14:00 in the main lecture hall.

  - code: PHYS150
    title: Classical Mechanics
    visible: 2
    public_code: PHYS150
    lang: el

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>BSc APM Case Study Mock CAS - Logout</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<style>
body { background: #f4f6f8; }
.brand { color: #153f65; font-weight: 600; }
.mock-banner {
  background: #fff8e1;
  border-left: 4px solid #d4a017;
  padding: 0.85rem 1rem;
  border-radius: 0.25rem;
  font-size: 0.95rem;
}
.cas-card { box-shadow: 0 6px 24px rgba(21,63,101,0.08); border: 0; }
</style>
</head>
<body>
<header class="bg-white border-bottom shadow-sm py-3">
  <div class="container d-flex align-items-center">
    <span class="brand h4 mb-0">BSc APM Case Study Mock CAS</span>
  </div>
</header>
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="mock-banner mb-4">
        <strong>Mock authentication service.</strong>
        BSc APM Case Study testing environment.
      </div>
      <div class="card cas-card">
        <div class="card-body p-4">
          <h2 class="card-title h5 mb-3">Signed out</h2>
          <p class="mb-0">
            You have been logged out of the mock CAS. The mock ticket-granting cookie has been cleared.
          </p>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Central Authentication Service - Login</title>
</head>
<body>
    <div class="login-container">
        <h1>Πόροι Πληροφορικής ΕΚΠΑ</h1>
        <h2>Κεντρική Υπηρεσία Πιστοποίησης</h2>
        
        <form id="fm1" action="/sso/login" method="post">
            <input type="hidden" name="execution" value="{{EXECUTION_TOKEN}}">
            <input type="hidden" name="service" value="{{SERVICE_URL}}">
            <input type="hidden" name="_eventId" value="submit">
            
            <div class="form-group">
                <label for="username">Όνομα χρήστη:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Κωδικός:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <input type="hidden" name="geolocation" value="">
                <button type="submit">ΣΥΝΔΕΣΗ</button>
            </div>
        </form>
    </div>
</body>
</html>

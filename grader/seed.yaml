# Pinned snapshot of the testing environment's seed data.
#
# The canonical file lives in the bsc-apm-case-study-env package at
# seed/seed.yaml; that file is the editable source of truth for the
# environment's data state, and the env's release pipeline turns it
# into seed.json and the mock CAS config. This copy is the grader-
# side mirror: the grader's assertions read these values directly,
# so the file moves in lock-step with the env release the grader
# is run against.
#
# Refresh procedure when the env's seed changes: copy the env's
# seed/seed.yaml verbatim over this file (preserving this header),
# then run the grader against the new release end-to-end to confirm
# the assertions still pass.


services:
  eclass:
    image: openeclass:test
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - config_data:/var/www/html/config
      - courses_data:/var/www/html/courses
      - video_data:/var/www/html/video
    environment:
      - MYSQL_LOCATION=db
      - MYSQL_ROOT_USER=root
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DB=eclass
      - BASE_URL=http://localhost
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - PHP_MAX_UPLOAD=256M
      # Force Greek language for testing
      - DEFAULT_LANGUAGE=el

  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=eclass
    command:
      - --innodb-buffer-pool-size=120M
      - --innodb_flush_log_at_trx_commit=2
      - --wait-timeout=86400
      - --max_allowed_packet=67108864
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: mysql --user=root --password=$$MYSQL_ROOT_PASSWORD -e 'show databases;' | grep -q $$MYSQL_DATABASE || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  config_data:
  courses_data:
  video_data:
  db_data:
